<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twtihtu | Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: linear-gradient(90deg,#38bdf8,#a855f7);
            -webkit-background-clip: text;
            color: transparent;
        }
        p {
            color:#94a3b8;
            font-size:1.1rem;
            margin-bottom:32px;
            line-height:1.7;
        }
        .links a{
            display:inline-block;
            text-decoration:none;
            color:#38bdf8;
            border:1px solid #38bdf8;
            padding:10px 24px;
            border-radius:999px;
            margin:8px;
            transition:0.3s;
        }
        .links a:hover{
            background:#38bdf8;
            color:#0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hi, I'm twtihtu</h1>
        <p>欢迎来到我的个人主页 | My Github Homepage</p>
        <div class="links">
            <a href="https://github.com/twtihtu" target="_blank">Github主页</a>
            <!-- 后续可以在这里添加博客、项目链接 -->
        </div>
    </div>
</body>
</html>
